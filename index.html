<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jose Trades · Live Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
:root{
  --bg:#0a0e14;--bg2:#11161f;--bg3:#161d27;--card:#121a24;
  --border:#1e2a36;--borderL:#253240;
  --text:#eef2f6;--text2:#8b9bb5;--muted:#5a6b82;
  --green:#00d68f;--greenBg:rgba(0,214,143,.1);
  --red:#ff4757;--redBg:rgba(255,71,87,.1);
  --blue:#3b82f6;--blueBg:rgba(59,130,246,.1);
  --purple:#8b5cf6;
}
html,body{overscroll-behavior-y:none}
body{background:var(--bg);color:var(--text);min-height:100vh;padding:12px;font-size:14px;-webkit-font-smoothing:antialiased;font-family:inherit}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(59,130,246,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(59,130,246,.03) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
.dashboard{position:relative;z-index:1;max-width:1600px;margin:0 auto;display:flex;flex-direction:column;gap:12px}

/* TOPBAR */
.topbar{display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:12px 18px;gap:12px}
.logo{display:flex;align-items:center;gap:9px;font-size:1.15rem;font-weight:700;letter-spacing:-.4px;flex-shrink:0}
.logo-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--blue),var(--purple));border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1rem;box-shadow:0 0 20px rgba(59,130,246,.4);color:#fff;flex-shrink:0}
.logo-text{background:linear-gradient(135deg,#fff,#8b9bb5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;white-space:nowrap}
.ticker{flex:1;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);min-width:0}
.ticker-track{display:flex;gap:26px;animation:scroll 30s linear infinite;white-space:nowrap;width:max-content}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.ticker-item{display:flex;align-items:center;gap:7px;font-size:.82rem;font-weight:500}
.ticker-symbol{color:var(--text2);font-weight:600}
.ticker-price{font-family:'SF Mono',monospace;font-weight:600;color:var(--text)}
.ticker-change{font-size:.72rem;font-weight:600;padding:2px 7px;border-radius:20px}
.ticker-change.up{color:var(--green);background:var(--greenBg)}
.ticker-change.down{color:var(--red);background:var(--redBg)}
.top-actions{display:flex;align-items:center;gap:10px;flex-shrink:0}
.status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 10px var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.status-text{font-size:.78rem;color:var(--text2);font-weight:500}
.avatar{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--purple));display:flex;align-items:center;justify-content:center;font-weight:600;font-size:.8rem;border:2px solid var(--borderL);color:#fff}

/* STATS */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;transition:all .3s;position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;width:100%;height:2px;background:linear-gradient(90deg,transparent,var(--blue),transparent);opacity:0;transition:opacity .3s}
.stat-card:hover::before{opacity:1}
.stat-card:hover{border-color:var(--borderL)}
.stat-label{font-size:.68rem;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;font-weight:600;margin-bottom:7px;display:flex;align-items:center;gap:6px}
.stat-label i{color:var(--blue);font-size:.7rem}
.stat-value{font-size:1.35rem;font-weight:700;letter-spacing:-.5px;font-family:'SF Mono',monospace;transition:color .3s}
.stat-sub{display:flex;align-items:center;gap:5px;margin-top:5px;font-size:.75rem;font-weight:500}
.stat-sub.positive{color:var(--green)}
.stat-sub.negative{color:var(--red)}
.edit-btn{background:var(--blueBg);border:1px solid var(--blue);color:var(--blue);padding:3px 9px;border-radius:7px;font-size:.65rem;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.4px;transition:all .2s}
.edit-btn:hover{background:var(--blue);color:#fff}
.balance-edit-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.balance-input{background:var(--bg);border:1px solid var(--blue);color:var(--text);padding:5px 9px;border-radius:8px;font-size:1rem;font-weight:700;font-family:'SF Mono',monospace;width:130px;outline:none}
.save-btn{background:var(--green);border:none;color:#000;padding:6px 11px;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer}
.save-btn:hover{filter:brightness(1.1)}
.cancel-btn{background:transparent;border:1px solid var(--border);color:var(--text2);padding:6px 11px;border-radius:8px;font-size:.72rem;font-weight:700;cursor:pointer}

/* MAIN GRID */
.main-grid{display:grid;grid-template-columns:1fr 320px;gap:12px}
.chart-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.chart-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap;gap:10px}
.pair-info{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pair-icon{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#f7931a,#f0b90b);display:flex;align-items:center;justify-content:center;font-size:1.25rem;color:#fff;flex-shrink:0}
.pair-name{font-size:1rem;font-weight:700}
.pair-name span{color:var(--text2);font-weight:500}
.pair-price{font-size:1.4rem;font-weight:700;font-family:'SF Mono',monospace;letter-spacing:-.5px;transition:color .2s}
.pair-price.up{color:var(--green)}
.pair-price.down{color:var(--red)}
.pair-stats{display:flex;gap:18px;font-size:.78rem}
.pair-stat{display:flex;flex-direction:column;gap:2px}
.pair-stat-label{color:var(--text2);font-size:.65rem;text-transform:uppercase;letter-spacing:.4px}
.pair-stat-value{font-family:'SF Mono',monospace;font-weight:600;font-size:.8rem}
.chart-controls{display:flex;gap:5px;flex-wrap:wrap}
.tf-btn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);padding:5px 11px;border-radius:7px;font-size:.72rem;font-weight:600;cursor:pointer;transition:all .2s}
.tf-btn:hover{border-color:var(--blue);color:var(--text)}
.tf-btn.active{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 0 12px rgba(59,130,246,.4)}
.chart-wrapper{position:relative;width:100%;height:320px;background:var(--bg);border-radius:11px;overflow:hidden;border:1px solid var(--border)}
#liveChart{display:block;width:100%;height:100%}

/* ORDER BOOK */
.orderbook-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.card-title{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;gap:7px}
.card-title i{color:var(--blue)}
.ob-header{display:grid;grid-template-columns:1fr 1fr 1fr;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:0 8px 7px;font-weight:600}
.ob-header span:nth-child(2),.ob-header span:nth-child(3){text-align:right}
.ob-list{display:flex;flex-direction:column;gap:2px;font-family:'SF Mono',monospace;font-size:.74rem}
.ob-row{display:grid;grid-template-columns:1fr 1fr 1fr;padding:4px 8px;border-radius:4px;position:relative;overflow:hidden;transition:background .15s}
.ob-row:hover{background:var(--bg3)}
.ob-row .bar{position:absolute;right:0;top:0;height:100%;opacity:.15;transition:width .4s}
.ob-row.ask .bar{background:var(--red)}
.ob-row.bid .bar{background:var(--green)}
.ob-row.ask .price{color:var(--red)}
.ob-row.bid .price{color:var(--green)}
.ob-row .price,.ob-row .amount,.ob-row .total{position:relative;z-index:1}
.ob-row .amount,.ob-row .total{text-align:right;color:var(--text2)}
.ob-mid{display:flex;align-items:center;justify-content:space-between;padding:10px 8px;margin:7px 0;background:var(--bg3);border-radius:8px;border:1px solid var(--border)}
.ob-mid-price{font-size:1.05rem;font-weight:700;font-family:'SF Mono',monospace}
.ob-mid-price.up{color:var(--green)}
.ob-mid-price.down{color:var(--red)}
.ob-mid-label{font-size:.62rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.ob-mid-spread{font-size:.7rem;color:var(--text2);font-family:'SF Mono',monospace;margin-top:3px}

/* BOTTOM GRID */
.bottom-grid{display:grid;grid-template-columns:380px 1fr;gap:12px}
.order-form-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px}
.side-tabs{display:flex;gap:7px;margin-bottom:14px}
.side-tab{flex:1;padding:11px;text-align:center;font-size:.85rem;font-weight:700;border-radius:9px;cursor:pointer;transition:all .2s;border:1px solid var(--border);background:var(--bg3);color:var(--text2);text-transform:uppercase;letter-spacing:.4px;user-select:none}
.side-tab.buy.active{background:var(--greenBg);border-color:var(--green);color:var(--green);box-shadow:0 0 16px rgba(0,214,143,.2)}
.side-tab.sell.active{background:var(--redBg);border-color:var(--red);color:var(--red);box-shadow:0 0 16px rgba(255,71,87,.2)}
.form-group{margin-bottom:12px}
.form-label{display:flex;justify-content:space-between;font-size:.7rem;color:var(--text2);margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
.form-label .available{color:var(--muted);text-transform:none;font-weight:500;font-family:'SF Mono',monospace}
.input-wrapper{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:9px;padding:0 13px;transition:all .2s}
.input-wrapper:focus-within{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.15)}
.input-wrapper input{flex:1;background:transparent;border:none;padding:12px 0;color:var(--text);font-size:.9rem;font-weight:600;font-family:'SF Mono',monospace;outline:none;width:100%}
.input-wrapper input::placeholder{color:var(--muted);font-weight:400}
.input-suffix{color:var(--text2);font-size:.75rem;font-weight:600;padding-left:8px}
.quick-amounts{display:flex;gap:5px;margin-top:7px}
.quick-amount{flex:1;padding:6px;text-align:center;background:var(--bg3);border:1px solid var(--border);border-radius:6px;font-size:.68rem;font-weight:600;color:var(--text2);cursor:pointer;transition:all .15s}
.quick-amount:hover{border-color:var(--blue);color:var(--blue)}
.order-summary{display:flex;justify-content:space-between;padding:9px 0;font-size:.78rem;color:var(--text2);border-top:1px solid var(--border);margin-top:10px}
.order-summary strong{color:var(--text);font-family:'SF Mono',monospace}
.submit-btn{width:100%;padding:13px;border-radius:11px;border:none;font-size:.9rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:10px;text-transform:uppercase;letter-spacing:.4px}
.submit-btn.buy{background:linear-gradient(135deg,var(--green),#00b377);color:#000;box-shadow:0 4px 16px rgba(0,214,143,.3)}
.submit-btn.sell{background:linear-gradient(135deg,var(--red),#d63031);color:#fff;box-shadow:0 4px 16px rgba(255,71,87,.3)}
.submit-btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.submit-btn:active{transform:translateY(0) scale(.98)}

/* TRADES */
.trades-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;display:flex;flex-direction:column}
.trades-list{display:flex;flex-direction:column;gap:2px;font-family:'SF Mono',monospace;font-size:.75rem;flex:1;overflow-y:auto;max-height:420px;padding-right:3px}
.trade-row{display:grid;grid-template-columns:55px 1fr 1fr 55px;gap:8px;padding:8px;border-radius:6px;animation:slideIn .3s ease;border-bottom:1px solid var(--border);align-items:center}
@keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
.trade-row .side-badge{font-size:.62rem;font-weight:700;padding:3px 5px;border-radius:4px;text-align:center;text-transform:uppercase;letter-spacing:.4px}
.trade-row .side-badge.buy{background:var(--greenBg);color:var(--green)}
.trade-row .side-badge.sell{background:var(--redBg);color:var(--red)}
.trade-row .detail{color:var(--text2);font-size:.72rem}
.trade-row .detail strong{color:var(--text)}
.trade-row .time{text-align:right;font-size:.68rem;color:var(--muted)}
.empty-state{text-align:center;padding:36px 20px;color:var(--muted);font-size:.82rem}
.empty-state i{font-size:1.8rem;margin-bottom:10px;opacity:.4;display:block}

/* TOASTS */
.toast-container{position:fixed;top:14px;right:14px;z-index:9999;display:flex;flex-direction:column;gap:9px;pointer-events:none}
.toast{background:var(--bg2);border:1px solid var(--borderL);border-radius:11px;padding:12px 16px;min-width:270px;box-shadow:0 10px 30px rgba(0,0,0,.6);display:flex;align-items:center;gap:11px;animation:toastIn .4s cubic-bezier(.68,-.55,.265,1.55);pointer-events:auto;border-left:3px solid var(--blue)}
.toast.success{border-left-color:var(--green)}
.toast.error{border-left-color:var(--red)}
.toast-icon{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.toast.success .toast-icon{background:var(--greenBg);color:var(--green)}
.toast.error .toast-icon{background:var(--redBg);color:var(--red)}
.toast.info .toast-icon{background:var(--blueBg);color:var(--blue)}
.toast-content{flex:1}
.toast-title{font-size:.82rem;font-weight:700;margin-bottom:2px}
.toast-msg{font-size:.72rem;color:var(--text2);font-family:'SF Mono',monospace}
@keyframes toastIn{from{transform:translateX(120%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast.hiding{animation:toastOut .3s forwards}
@keyframes toastOut{to{transform:translateX(120%);opacity:0}}

/* POSITIONS */
.positions-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px;overflow-x:auto}
.positions-table{width:100%;border-collapse:collapse;font-size:.78rem;min-width:560px}
.positions-table th{text-align:left;font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;padding:8px 10px;border-bottom:1px solid var(--border);font-weight:600}
.positions-table td{padding:11px 10px;border-bottom:1px solid var(--border);font-family:'SF Mono',monospace}
.positions-table tr:last-child td{border-bottom:none}
.positions-table tbody tr:hover{background:var(--bg3)}
.pos-pair{font-weight:700;font-family:'Inter',sans-serif}
.pos-side{font-size:.66rem;font-weight:700;padding:3px 9px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px;display:inline-block;font-family:'Inter',sans-serif}
.pos-side.long{background:var(--greenBg);color:var(--green)}
.pos-side.short{background:var(--redBg);color:var(--red)}
.pnl-pos{color:var(--green);font-weight:600}
.pnl-neg{color:var(--red);font-weight:600}

/* MOBILE */
@media (max-width:1200px){.main-grid{grid-template-columns:1fr}.bottom-grid{grid-template-columns:1fr}}
@media (max-width:768px){
  body{padding:8px;font-size:13px}
  .dashboard{gap:9px}
  .topbar{padding:10px 12px;border-radius:12px}
  .logo{font-size:1rem;gap:7px}
  .logo-icon{width:30px;height:30px;font-size:.9rem;border-radius:8px}
  .ticker{display:none}
  .status-text{display:none}
  .avatar{width:30px;height:30px;font-size:.72rem}
  .stats-row{grid-template-columns:repeat(2,1fr);gap:9px}
  .stat-card{padding:12px;border-radius:11px}
  .stat-value{font-size:1rem}
  .stat-label{font-size:.62rem}
  .edit-btn{font-size:.6rem;padding:3px 7px}
  .balance-input{width:100px;font-size:.85rem;padding:4px 7px}
  .chart-card{padding:12px;border-radius:12px}
  .chart-header{gap:8px;margin-bottom:9px}
  .pair-icon{width:32px;height:32px;font-size:1rem}
  .pair-name{font-size:.9rem}
  .pair-price{font-size:1.15rem}
  .pair-stats{display:none}
  .tf-btn{padding:4px 7px;font-size:.65rem}
  .chart-wrapper{height:200px}
  .orderbook-card{padding:12px;border-radius:12px}
  .ob-list{font-size:.68rem}
  .ob-row{padding:3px 5px}
  .ob-mid{padding:8px 6px}
  .ob-mid-price{font-size:.9rem}
  .order-form-card{padding:12px;border-radius:12px}
  .side-tab{padding:9px;font-size:.78rem}
  .submit-btn{padding:11px;font-size:.82rem}
  .input-wrapper input{font-size:.85rem;padding:10px 0}
  .trades-card{padding:12px;border-radius:12px}
  .trades-list{font-size:.68rem;max-height:300px}
  .trade-row{grid-template-columns:48px 1fr 1fr 48px;gap:4px;padding:6px 4px}
  .positions-card{padding:12px;border-radius:12px}
  .positions-table{font-size:.72rem}
  .positions-table th,.positions-table td{padding:8px 5px}
  .toast-container{top:8px;right:8px;left:8px}
  .toast{min-width:auto;width:100%}
}
@media (max-width:380px){
  .stats-row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div class="toast-container" id="toastContainer"></div>

<div class="dashboard">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon"><i class="fas fa-bolt"></i></div>
      <span class="logo-text">Jose<span style="font-weight:400;color:var(--text2);">Trades</span></span>
    </div>
    <div class="ticker"><div class="ticker-track" id="tickerTrack"></div></div>
    <div class="top-actions">
      <div class="status-dot"></div>
      <span class="status-text">Live</span>
      <div class="avatar">JT</div>
    </div>
  </div>

  <!-- STATS -->
  <div class="stats-row">
    <div class="stat-card">
      <div class="stat-label">
        <span><i class="fas fa-wallet"></i> Demo Balance</span>
        <button class="edit-btn" id="editBalBtn"><i class="fas fa-pen"></i> Edit</button>
      </div>
      <div id="balanceDisplay">
        <div class="stat-value" id="balanceValue">$10,000.00</div>
        <div class="stat-sub positive" id="balanceChange"><i class="fas fa-arrow-up"></i> Starting balance</div>
      </div>
      <div id="balanceEdit" style="display:none">
        <div class="balance-edit-row">
          <input type="number" class="balance-input" id="balanceInput" value="10000" step="100" min="0">
          <button class="save-btn" id="saveBalBtn"><i class="fas fa-check"></i> Save</button>
          <button class="cancel-btn" id="cancelBalBtn">Cancel</button>
        </div>
      </div>
    </div>

    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-chart-line"></i> Unrealized P&L</div>
      <div class="stat-value" id="pnlValue" style="color:var(--text2)">$0.00</div>
      <div class="stat-sub" id="pnlSub"><i class="fas fa-minus"></i> No open positions</div>
    </div>

    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-coins"></i> Equity</div>
      <div class="stat-value" id="equityValue">$10,000.00</div>
      <div class="stat-sub positive"><i class="fas fa-shield"></i> Real-time</div>
    </div>

    <div class="stat-card">
      <div class="stat-label"><i class="fas fa-briefcase"></i> Open Positions</div>
      <div class="stat-value" id="posCount">0</div>
      <div class="stat-sub" id="posSub" style="color:var(--text2)"><i class="fas fa-info-circle"></i> No trades yet</div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="main-grid">
    <div class="chart-card">
      <div class="chart-header">
        <div class="pair-info">
          <div class="pair-icon"><i class="fab fa-bitcoin"></i></div>
          <div>
            <div class="pair-name">BTC <span>/ USDT</span></div>
            <div class="pair-price" id="pairPrice">$63,842.50</div>
          </div>
          <div class="pair-stats">
            <div class="pair-stat"><span class="pair-stat-label">24h High</span><span class="pair-stat
